; DayZ plugin loader (dxgi.dll). Plugins are DLLs in plugins_dir that export the C API in
; include/dayz_plugin_api.h; the VR plugin is plugins/dayzvr.dll with its own dayz_openxr.ini.
; Log: dayz_pluginloader.log beside DayZ_x64.exe.
[loader]
enabled=true
plugins_dir=plugins

; Hotkey bindings, one per registered action: <plugin>.<action>=<key>. Keys: a-z, 0-9,
; f1-f24, numpad0-9, home end insert delete pageup pagedown pause scrolllock backspace
; tab space enter escape up down left right caret grave, 0x<vk>; modifiers ctrl+ alt+
; shift+; "none" unbinds. Missing lines use the plugin's default.
[hotkeys]
dayzvr.toggle_vr=F12
dayzvr.recenter=F11
