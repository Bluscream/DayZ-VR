[openxr]
enabled=true

[gui]
# Main menu and inventory are captured separately and submitted as a world-locked
# OpenXR quad. The normal in-game HUD keeps using the existing rendering path.
quad_enabled=true
quad_pixel_width=1920
quad_pixel_height=1400
quad_width_meters=1.4
quad_distance=1.25
quad_vertical_offset=-0.10
# Keep HMD look active while the in-game inventory owns mouse input. Main-menu
# cursor mode is not affected.
inventory_hmd_look=true
# Fraction of HMD rotation used to keep the 3D character preview aligned with
# the world-locked inventory. Item previews follow the GUI without compensation.
inventory_preview_rotation_scale=0.5
inventory_player_preview_visible=true
# DayZ's Gauss post-process blur used behind the in-game inventory.
inventory_blur_enabled=false

[debug]
# Loads dayz_openxr_debug.dll from the game directory, which serves live tracking
# state and runtime tunables on 127.0.0.1:<port>. Use scripts/dayz-vr-ctl.py to
# talk to it. On for the headless test rig (scripts/regression-run.sh needs it); the
# plugin DLL is optional and never linked in.
enabled=true
port=48621
plugin=dayz_openxr_debug.dll

[hooks]
enabled=true
# DayZ drops to ~20 fps whenever its window is not in the foreground, which in VR
# is most of the time. keep_focus makes the engine see its window as always active
# (foreground/active/focus queries and deactivation messages). Head-look and
# controller input still require the real window focus because they use SendInput.
keep_focus=true

[stereo]
# Observation-only prerequisite for true per-eye rendering. It validates the exact
# DayZ build and records Camera/RenderContext prepare/execute/finalize ownership.
runtime_probe=true
alternate_eye=true
# alternate: one eye per game frame (each eye at half the frame rate).
# double (experimental): render the world twice per frame, once per eye, by
# calling DayZ's world render a second time; halves the game frame rate but
# gives both eyes every frame. Falls back to alternate if the build is unknown.
stereo_mode=alternate
# double mode only: DayZ clears two full-size targets per pass; the left eye is
# captured right before this clear of the frame (3 = start of the right pass).
double_capture_clear=3
hmd_rotation=true
# Meters of DayZ camera translation per meter of physical HMD movement.
hmd_position_scale=1.0
# Absolute DayZ gameplay FOV in radians, applied only to the in-memory profile value.
# The .DayZProfile file is never modified. 0 disables the override.
game_fov=1.48353004
# prepare_translation: write the eye/head translation into the primary camera before
# every scene preparation, not only in the projection dispatch; DayZ fixes object
# placement relative to the camera during preparation, so a translation written later
# never reached the image. Live tunable.
prepare_translation=true
# frame_records: file one frozen headset sample per game frame where the pose is
# applied to the camera; frame_lag game frames later DayZ's Present shows that frame,
# so the capture is stored under the eye it was rendered for and (with
# submit_rendered_pose) the compositor receives the pose the image was rendered with and
# reprojects it to the display pose instead of gluing an older image to the head.
# frame_lag is the engine's game-to-present pipeline depth (1 on 1.29.163709, measured by the parallax sign; wrong
# values swap the eyes). Live tunables.
frame_records=true
frame_lag=1
submit_rendered_pose=true
# Distance between the two game cameras in DayZ world units. Negative on this rig:
# the positive sign showed the eyes swapped on WiVRn (TASKS.md, headset session).
camera_separation=-0.064
# Symmetric screen-space shift as a fraction of one eye image width.
# Positive values move the left image left and the right image right.
image_shift=-0.128
# contain keeps aspect with bars; stretch fills the eye; cover crops to fill.
fit_mode=stretch
# Independent final image scale. Below 1 shrinks; above 1 crops/overscans.
scale_x=1.0
scale_y=1.0
# Native DayZ IGUIScale override. Stock fallback is 0.85.
override_hud_scale=true
hud_scale=0.60
hud_safe_width=1600
hud_safe_height=900
# Experimental centered viewport for identifying the native HUD draw pass.
hud_composite_width=0
hud_composite_height=0
hud_left_offset_x=0
hud_right_offset_x=0
gui_mouse_remap=true
gui_cursor=true
# Square backbuffer override so each eye gets a square image (headset-tested).
override_game_resolution=true
render_width=1600
render_height=1600

[patches]
# Workarounds for DayZ engine bugs the proxy exposes (see common/dayz_patches.cpp).
# DayZ 1.29 can execute a render view whose prepared-view pointer was already
# cleared (seen after dragging the game window) and crashes at DayZ+0x1DDE4B.
# The guard skips that single executeView call and logs it instead.
guard_execute_without_prepared_view=true
