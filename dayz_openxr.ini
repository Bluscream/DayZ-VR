[openxr]
enabled=true
debug_layer=false
reference_space=local

[render]
mode=game
submit_when_unfocused=false

[gui]
# Main menu and inventory are captured separately and submitted as a world-locked
# OpenXR quad. The normal in-game HUD keeps using the existing rendering path.
quad_enabled=true
quad_pixel_width=1920
quad_pixel_height=1400
quad_width_meters=1.4
quad_distance=1.25
quad_vertical_offset=-0.10
# Keep HMD look active while the in-game inventory owns mouse input. Main-menu
# cursor mode is not affected.
inventory_hmd_look=true
# Fraction of HMD rotation used to keep the 3D character preview aligned with
# the world-locked inventory. Item previews follow the GUI without compensation.
inventory_preview_rotation_scale=0.5
inventory_player_preview_visible=true
# DayZ's Gauss post-process blur used behind the in-game inventory.
inventory_blur_enabled=false

[controls]
enabled=true
show_controller_axes=true
# GUI pointer: translucent cyan, two crossed planes duplicated for both sides.
show_gui_ray=true
gui_ray_length=2.0
gui_ray_thickness=0.004
# Gameplay direction probes: HMD=white, right aim=blue,
# native DayZ camera=yellow, final render camera=magenta.
show_direction_rays=true
direction_ray_length=3.0
direction_ray_thickness=0.006
deadzone=0.30
# Right-stick turning. With [stereo] hmd_aim_closed_loop the stick rotates the
# head-aim target: turn_rate is degrees per second of smooth turning at full
# deflection; snap_turn > 0 instead turns by that many degrees once per flick.
turn_rate=90
# Clicking the left thumbstick recenters the view (same as the recenter hotkey).
recenter_stick_click=true
snap_turn=0
# Open-loop fallback only: relative mouse counts per frame at full deflection.
turn_scale=18.0

[logging]
level=debug
file=dayz_openxr.log

[debug]
# Loads dayz_openxr_debug.dll from the game directory, which serves live tracking
# state and runtime tunables on 127.0.0.1:<port>. Use scripts/dayz-vr-ctl.py to
# talk to it. Off by default; the plugin DLL is optional and never linked in.
enabled=false
port=48621
plugin=dayz_openxr_debug.dll

[hooks]
enabled=true
present=true
present1=true
resize_buffers=true
# DayZ drops to ~20 fps whenever its window is not in the foreground, which in VR
# is most of the time. keep_focus makes the engine see its window as always active
# (foreground/active/focus queries and deactivation messages). Head-look and
# controller input still require the real window focus because they use SendInput.
keep_focus=true

[stereo]
# Observation-only prerequisite for true per-eye rendering. It validates the exact
# DayZ build and records Camera/RenderContext prepare/execute/finalize ownership.
runtime_probe=true
alternate_eye=true
# alternate: one eye per game frame (each eye at half the frame rate).
# double (experimental): render the world twice per frame, once per eye, by
# calling DayZ's world render a second time; halves the game frame rate but
# gives both eyes every frame. Falls back to alternate if the build is unknown.
stereo_mode=alternate
# double mode only: DayZ clears two full-size targets per pass; the left eye is
# captured right before this clear of the frame (3 = start of the right pass).
double_capture_clear=3
hmd_rotation=true
# Route HMD yaw/pitch through DayZ's native mouse camera so aim-ray, shots,
# player body and first-person weapon use exactly the rendered direction.
# Roll remains a render-only camera transform because mouse look has no roll.
hmd_native_aim=true
# Meters of DayZ camera translation per meter of physical HMD movement.
hmd_position_scale=1.0
# Absolute DayZ gameplay FOV in radians, applied only to the in-memory profile value.
# The .DayZProfile file is never modified. 0 disables the override.
game_fov=1.48353004
# Signed relative mouse counts per HMD radian. Change magnitude if head turning
# is too slow/fast; invert one sign if that axis moves in the wrong direction.
hmd_mouse_yaw_scale=-600
hmd_mouse_pitch_scale=-600
# Lock an axis: the HMD no longer drives DayZ's mouse camera on it, the
# rendered view still follows your head. Useful to keep the aim level while
# looking up/down, or to turn only with the stick/mouse while looking around.
lock_yaw=false
lock_pitch=false
# Closed-loop head aim: every frame the mod compares where DayZ's camera points
# with where the HMD points and injects only the mouse counts needed to close
# the gap. DayZ scales mouse deltas by frame time, so the fixed hmd_mouse_*
# scales above can only be right at one frame rate; with the loop they are just
# the starting guess and the real counts-per-radian is learned while playing.
hmd_aim_closed_loop=true
# Fraction of the remaining error corrected per frame (lower = smoother, slower).
hmd_aim_loop_damping=0.5
# Hard cap on injected counts per frame and axis.
hmd_aim_loop_max_counts=400
# Decoupled aim: DayZ's camera (and so the weapon) follows the right controller's
# aim pose while your eyes keep showing where your head points. Needs the
# closed loop. Falls back to head aim whenever the controller is not tracked.
controller_aim=false
# Distance between the two game cameras in DayZ world units.
camera_separation=0.064
# Symmetric screen-space shift as a fraction of one eye image width.
# Positive values move the left image left and the right image right.
image_shift=0.0
# contain keeps aspect with bars; stretch fills the eye; cover crops to fill.
fit_mode=stretch
# Independent final image scale. Below 1 shrinks; above 1 crops/overscans.
scale_x=1.0
scale_y=1.0
# Native DayZ IGUIScale override. Stock fallback is 0.85.
override_hud_scale=false
hud_scale=0.70
hud_safe_width=0
hud_safe_height=0
# Experimental centered viewport for identifying the native HUD draw pass.
hud_composite_width=0
hud_composite_height=0
hud_left_offset_x=0
hud_right_offset_x=0
gui_mouse_remap=true
gui_cursor=true
# Optional square backbuffer override; disabled in the generic build config.
override_game_resolution=false
render_width=1600
render_height=1600

[comfort]
# Darken the edges of each eye while moving or smooth-turning with the sticks
# (snap turns are instantaneous and never vignette). Strength is the edge
# darkness, radius the clear centre (fraction of the eye image), fade in seconds.
vignette=false
vignette_strength=0.8
vignette_radius=0.6
vignette_fade_seconds=0.2

[hud]
# Controller-anchored ammo display: a small world-space quad above the right hand
# showing the magazine count and chambered round ("30+1") as seven-segment digits,
# fed by the @DayZVR script bridge (needs [bridge] enabled and -mod=@DayZVR). It is the
# VR counterpart of the screen-space label the mod draws; both can be on. Offsets are
# metres in the right grip pose (x right, y up along the handle top, z back towards
# the wrist); tilt rotates the quad about its x axis so it faces the eyes.
ammo_quad=true
ammo_quad_width_meters=0.07
ammo_quad_offset_x=0.0
ammo_quad_offset_y=0.04
ammo_quad_offset_z=-0.02
ammo_quad_tilt_degrees=40
ammo_quad_pixel_height=48

[melee]
# Motion-controlled melee: swinging the right controller presses DayZ's attack button
# while fists or a melee weapon are in hands (needs the @DayZVR bridge for the "melee"
# flag). A swing starts above light_speed (m/s); a peak at or above heavy_speed holds
# the button for heavy_hold_seconds (heavy attack), slower swings tap it. One event per
# swing, at most one per cooldown_seconds. All keys are live tunables (melee.*).
motion_swing=false
light_speed=1.6
heavy_speed=3.2
cooldown_seconds=0.5
heavy_hold_seconds=0.45

[haptics]
# Controller vibration. fire pulses the right controller for every round the @DayZVR
# bridge reports as fired (magazine + chamber dropping by one while the weapon stays
# the same). Live tunables (haptics.*); `dayz-vr-ctl.py haptic` sends a test pulse.
fire=true
fire_seconds=0.08
fire_amplitude=0.8

[stance]
# Physical crouch/prone: the head dropping below the standing height (captured at the
# first tracked frame and after every recenter, F9 / left stick click) taps DayZ's
# crouch (C) and prone (Z) toggles until the game reports the matching stance.
# Thresholds in metres below standing; hysteresis keeps head bobbing from toggling.
# Needs the @DayZVR bridge for the stance readback. Live tunables (stance.*).
physical=false
crouch_drop=0.35
prone_drop=0.85
hysteresis=0.08

[vehicle]
# Two-hand steering wheel while driving: the line between the left and right grips is
# the rim; tilting it (right hand down = clockwise) steers right. wheel_max_degrees is
# the tilt for full lock, deadzone the ignored fraction around centre. The value goes
# through the @DayZVR bridge (vr.txt steer=) and the mod applies Car.SetSteering while
# the local player drives; keyboard/stick steering keeps working when the hands are
# not both tracked. While driving the triggers become pedals (right = throttle, left =
# brake, applied only while pressed) instead of mouse buttons. Live tunables (vehicle.*).
steering=true
wheel_max_degrees=90
deadzone=0.05
invert=false
# Hold both grips (squeeze > 50 %) to take the wheel; release to let go.
require_grip=true

[bridge]
# Enforce Script bridge: exchanges key=value text files with the optional
# @DayZVR client mod (enforce/DayZVR, packed by scripts/build-pbo.py) under
# <profile>/dayzvr/. vr.txt (poses, aim state) is written every interval_frames;
# game.txt (weapon, ammo, health level, stance, inventory) is read at the same rate.
# <profile> is %LOCALAPPDATA%\DayZ unless DayZ runs with -profiles=.
enabled=true
interval_frames=6
# ammo_counter: the @DayZVR mod draws the magazine's round count as a small label
# projected next to the magazine of the weapon in hands (hidden with the HUD, in
# menus and when nothing with a magazine is held). Needs the mod (-mod=@DayZVR).
ammo_counter=true

[hotkeys]
# Keyboard hotkeys, polled while DayZ is the foreground window. Format is an
# optional modifier chain plus a key: F9, ctrl+alt+home, shift+numpad5, 0x78.
# Empty disables the hotkey.
# recenter: recapture the HMD yaw and position centre (same as the debug
# "recenter" command) so the current head pose becomes straight ahead.
recenter=F9
# toggle1..toggle8 flip a boolean tunable while playing: "<key> <section.key>",
# any Bool entry from `dayz-vr-ctl.py tunables` works.
toggle1=F10 stereo.lock_pitch
toggle2=F11 stereo.lock_yaw
toggle3=F12 stereo.controller_aim

[patches]
# Workarounds for DayZ engine bugs the proxy exposes (see common/dayz_patches.cpp).
# DayZ 1.29 can execute a render view whose prepared-view pointer was already
# cleared (seen after dragging the game window) and crashes at DayZ+0x1DDE4B.
# The guard skips that single executeView call and logs it instead.
guard_execute_without_prepared_view=true
